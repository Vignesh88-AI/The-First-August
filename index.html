<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter a Passcode 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', 'Quicksand', cursive, sans-serif;
      background: #d8edd5;
    }

    /* ======================== FULLSCREEN SPLIT (50/50) ======================== */
    .wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* ======================== LEFT: EXACT SAGE PLAID GINGHAM ======================== */
    .left {
      width: 50%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #dbeed7;
      background-image: 
        linear-gradient(90deg, rgba(255, 255, 255, 0.65) 38%, transparent 38%, transparent 62%, rgba(165, 212, 158, 0.45) 62%),
        linear-gradient(rgba(255, 255, 255, 0.65) 38%, transparent 38%, transparent 62%, rgba(165, 212, 158, 0.45) 62%);
      background-size: 52px 52px;
    }

    /* Pink glitter floating stars matching reference */
    .star {
      position: absolute;
      color: #e62b68;
      font-size: 1.6rem;
      filter: drop-shadow(0 2px 4px rgba(230, 43, 104, 0.4));
      pointer-events: none;
      animation: floatStar 3.2s ease-in-out infinite alternate;
      z-index: 2;
    }
    .s1 { top:7%;  left:9%;   font-size:2.2rem; animation-delay:0s;   }
    .s2 { top:12%; right:9%;  font-size:1.6rem; animation-delay:.5s;  }
    .s3 { top:40%; right:6%;  font-size:1.9rem; animation-delay:1s;   }
    .s4 { bottom:9%; left:9%; font-size:1.8rem; animation-delay:1.5s; }
    .s5 { bottom:11%; right:10%; font-size:2.1rem; animation-delay:.8s;  }
    .s6 { top:75%; left:16%;  font-size:1.5rem; animation-delay:1.3s; }
    .s7 { top:5%;  right:20%; font-size:1.8rem; animation-delay:.2s;  }
    .s8 { top:46%; left:4%;   font-size:1.6rem; animation-delay:2s;   }

    @keyframes floatStar {
      0%   { transform: translateY(0) scale(1) rotate(0deg); }
      100% { transform: translateY(-10px) scale(1.2) rotate(15deg); }
    }

    /* ======================== OVAL FRAME & HEARTS RING ======================== */
    .oval-wrap {
      position: relative;
      width: clamp(270px, 35vh, 400px);
      height: clamp(360px, 47vh, 520px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .oval-wrap:hover {
      transform: scale(1.02);
    }

    /* Continuous Ring of 30 Small Pink/Red Hearts around Oval */
    .hearts-ring {
      position: absolute;
      inset: -18px;
      pointer-events: none;
      z-index: 10;
    }

    .heart-dot {
      position: absolute;
      font-size: clamp(0.95rem, 1.35vh, 1.3rem);
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(220, 30, 70, 0.4));
      animation: pulseHeart 2.5s ease-in-out infinite alternate;
    }

    @keyframes pulseHeart {
      0% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); }
      100% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.15); }
    }

    /* White Oval Frame matching Reference Screenshot */
    .oval {
      width: 100%;
      height: 100%;
      border-radius: 50% / 50%;
      background: #ffffff;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.15),
        inset 0 0 15px rgba(0, 0, 0, 0.02),
        0 0 0 8px #ffffff;
      border: 4px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Image / Vector Illustration Container */
    .chick-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chick-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ======================== RIGHT: SOLID PINK SIDE ======================== */
    .right {
      width: 50%;
      height: 100%;
      background: #e02b5a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5vh 4vw;
      gap: clamp(16px, 2.8vh, 32px);
      position: relative;
    }

    /* Title at top in white bold text */
    .title {
      color: #ffffff;
      font-size: clamp(1.8rem, 3.2vw, 3.2rem);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,.15);
      letter-spacing: .3px;
    }

    /* 4 Empty White Rounded Square Boxes */
    .pin-row {
      display: flex;
      gap: clamp(10px, 1.4vw, 18px);
      position: relative;
    }

    .pin-row.shake {
      animation: shakeX 0.4s ease-in-out;
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-12px); }
      40%, 80% { transform: translateX(12px); }
    }

    .pin-box {
      width: clamp(48px, 6vw, 70px);
      height: clamp(48px, 6vw, 70px);
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s cubic-bezier(.175,.885,.32,1.275), box-shadow .2s;
      position: relative;
    }
    .pin-box.filled {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0,0,0,.24);
    }
    .pin-box.filled::after {
      content: '●';
      color: #e02b5a;
      font-size: clamp(1.3rem, 2.2vw, 1.8rem);
      animation: pop .2s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes pop {
      0%   { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Error Toast */
    .error-toast {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%) translateY(-5px);
      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .error-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Classic Phone-Style Number Pad (White Circular Raised Buttons) */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vh, 22px) clamp(12px, 1.8vw, 26px);
      width: 100%;
      max-width: clamp(220px, 29vw, 370px);
    }

    .key {
      width: clamp(58px, 6.4vw, 80px);
      height: clamp(58px, 6.4vw, 80px);
      border-radius: 50%;
      background: #ffffff;
      border: none;
      color: #e02b5a;
      font-family: 'Fredoka', cursive;
      font-size: clamp(1.5rem, 2.2vw, 2.3rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      box-shadow: 0 6px 16px rgba(0,0,0,.18), inset 0 -3px 0 rgba(0,0,0,.09);
      transition: transform .12s ease, box-shadow .12s ease;
      outline: none;
      user-select: none;
    }
    .key:hover  { transform: translateY(-2px) scale(1.05); box-shadow: 0 10px 22px rgba(0,0,0,.24), inset 0 -3px 0 rgba(0,0,0,.09); }
    .key:active { transform: translateY(2px) scale(.96);   box-shadow: 0 2px 6px rgba(0,0,0,.15), inset 0 1px 2px rgba(0,0,0,.12); }

    /* Hint Bar */
    .hint-bar {
      margin-top: 4px;
    }
    .hint-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
    }

    /* ======================== MODAL ======================== */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .modal-bg.hidden { display: none !important; }
    .modal-card {
      background: #ffffff;
      border-radius: 26px;
      padding: 36px 28px;
      max-width: 380px; width: 100%;
      text-align: center;
      box-shadow: 0 22px 44px rgba(0,0,0,.3);
      animation: mpop .3s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes mpop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
    .modal-icon  { font-size: 3.5rem; margin-bottom: 10px; }
    .modal-card h2 { color: #e02b5a; font-size: 1.9rem; margin-bottom: 8px; }
    .modal-card p  { color: #4a5568; font-size: 1.05rem; margin-bottom: 22px; line-height: 1.5; }
    .modal-btn {
      background: #e02b5a; color: #ffffff; border: none;
      padding: 13px 28px; border-radius: 30px;
      font-family: 'Fredoka', cursive; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; box-shadow: 0 6px 18px rgba(224,43,90,.35);
      transition: transform .15s, background .15s;
    }
    .modal-btn:hover { transform: scale(1.05); background: #c7224c; }

    /* ======================== MOBILE ======================== */
    @media (max-width: 700px) {
      html, body { overflow-y: auto; }
      .wrapper { flex-direction: column; height: auto; min-height: 100vh; }
      .left  { width: 100%; height: 62vw; min-height: 270px; }

      .oval-wrap { width: 46vw; height: 60vw; max-width: 240px; max-height: 310px; }
    }
  </style>
</head>

<script>
  /* ====== HEARTS RING (30 Red/Pink Outlined Hearts along Oval) ====== */
  function makeHearts(){
    const ring = document.getElementById('heartsRing');
    if (!ring) return;
    ring.innerHTML = '';
    const n = 30;
    for(let i = 0; i < n; i++){
      const ang = (i / n) * 2 * Math.PI - Math.PI / 2;
      const x = 50 + 49 * Math.cos(ang);
      const y = 50 + 49 * Math.sin(ang);
      const el = document.createElement('span');
      el.className = 'heart-dot';
      el.textContent = '❤️';
      el.style.left = x + '%';
      el.style.top  = y + '%';
      const rot = (ang * 180 / Math.PI + 90);
      el.style.setProperty('--rot', rot + 'deg');
      el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
      el.style.animationDelay = (i * 0.08) + 's';
      ring.appendChild(el);
    }
  }
  makeHearts();
  window.addEventListener('resize', makeHearts);

  /* ====== PIN LOGIC (CORRECT PASSCODE: 2910) ====== */
  (function(){
    let pin = '';
    const CORRECT_PIN = '2910';
    const boxes = document.querySelectorAll('.pin-box');
    const pinRow = document.getElementById('pinRow');
    const errorToast = document.getElementById('errorToast');
    const modal = document.getElementById('modal');
    const close = document.getElementById('modalClose');

    function refresh(){
      boxes.forEach((b, i) => b.classList.toggle('filled', i < pin.length));

      // Validate when 4 digits entered
      if (pin.length === 4) {
        if (pin === CORRECT_PIN) {
          setTimeout(() => {
            modal.classList.remove('hidden');
          }, 240);
        } else {
          // Incorrect PIN feedback
          setTimeout(() => {
            pinRow.classList.add('shake');
            if (errorToast) errorToast.classList.add('show');
            setTimeout(() => {
              pinRow.classList.remove('shake');
              if (errorToast) errorToast.classList.remove('show');
              pin = '';
              refresh();
            }, 750);
          }, 180);
        }
      }
    }

    function push(v){
      if (pin.length < 4) {
        pin += v;
        refresh();
        if (navigator.vibrate) try { navigator.vibrate(18); } catch(e) {}
      }
    }

    function handleBackspace() {
      if (pin.length > 0) {
        pin = pin.slice(0, -1);
        refresh();
      }
    }

    function reset() {
      pin = '';
      refresh();
      modal.classList.add('hidden');
    }

    document.getElementById('keypad').addEventListener('click', e => {
      const b = e.target.closest('.key');
      if (!b) return;
      const val = b.dataset.v;
      if (val === '*') {
        handleBackspace();
      } else {
        push(val);
      }
    });

    close.addEventListener('click', reset);

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') push(e.key);
      else if (e.key === '*' || e.key === '#') push(e.key);
      else if (e.key === 'Backspace') handleBackspace();
      else if (e.key === 'Escape') reset();
    });
  })();
</script>
</body>
</html>
