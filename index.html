<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Passcode Lock | Secret Diary</title>
  
  <!-- Google Fonts for cute typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@600;700&family=Short+Stack&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Container -->
  <div class="app-container">
    
    <!-- Left Panel: Constant Illustration -->
    <div class="left-panel" id="left-panel">
      
      <!-- Seamless Background & Image Wrapper -->
      <div class="illustration-wrapper">
        <!-- SVG Vector Fallback Illustration (Guarantees visual display out of the box) -->
        <div class="svg-chick-container" id="svg-fallback">
          <svg viewBox="0 0 500 650" class="chick-svg-art">
            <!-- Background Plaid Grid overlay -->
            <defs>
              <pattern id="plaidPattern" width="60" height="60" patternUnits="userSpaceOnUse">
                <rect width="60" height="60" fill="#e2ebdc"/>
                <rect width="30" height="60" fill="#d0dfc8" opacity="0.5"/>
                <rect width="60" height="30" fill="#c3d7ba" opacity="0.5"/>
                <line x1="0" y1="15" x2="60" y2="15" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
                <line x1="15" y1="0" x2="15" y2="60" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#plaidPattern)"/>
            
            <!-- Glitter Stars -->
            <text x="70" y="80" font-size="28" fill="#e63973">★</text>
            <text x="410" y="60" font-size="24" fill="#e63973">★</text>
            <text x="430" y="240" font-size="26" fill="#e63973">★</text>
            <text x="50" y="380" font-size="28" fill="#e63973">★</text>
            <text x="420" y="460" font-size="25" fill="#e63973">★</text>
            <text x="100" y="580" font-size="26" fill="#e63973">★</text>
            <text x="320" y="600" font-size="24" fill="#e63973">★</text>

            <!-- Center Oval Heart Badge -->
            <g transform="translate(250, 325)">
              <!-- Outer Brown Frame -->
              <ellipse rx="150" ry="210" fill="#ffffff" stroke="#7a4b37" stroke-width="6"/>
              
              <!-- Pink Hearts Border Loop -->
              <ellipse rx="138" ry="195" fill="none" stroke="#e8899e" stroke-width="8" stroke-dasharray="12, 10"/>
              
              <!-- Inner White Shield -->
              <ellipse rx="126" ry="180" fill="#ffffff"/>
              
              <!-- Yellow Chick Body -->
              <ellipse cx="0" cy="30" rx="90" ry="85" fill="#fce592"/>
              <ellipse cx="0" cy="-30" rx="75" ry="70" fill="#fce592"/>
              
              <!-- Blush Cheeks -->
              <ellipse cx="-45" cy="-25" rx="14" ry="9" fill="#ffaab8" opacity="0.8"/>
              <ellipse cx="45" cy="-25" rx="14" ry="9" fill="#ffaab8" opacity="0.8"/>
              
              <!-- Cute Eyes -->
              <circle cx="-30" cy="-35" r="5" fill="#54372b"/>
              <circle cx="30" cy="-35" r="5" fill="#54372b"/>
              
              <!-- Orange Beak -->
              <polygon points="-8,-28 8,-28 0,-20" fill="#f09236"/>
              
              <!-- Little Feet -->
              <ellipse cx="-40" cy="100" rx="20" ry="12" fill="#f09236"/>
              <ellipse cx="40" cy="100" rx="20" ry="12" fill="#f09236"/>

              <!-- Flowers in Hands -->
              <g transform="translate(35, 0)">
                <!-- Stems -->
                <path d="M -15,40 Q -5,10 10,-20" stroke="#689f38" stroke-width="4" fill="none"/>
                <!-- Yellow Daisy -->
                <circle cx="15" cy="-20" r="14" fill="#fbc02d"/>
                <circle cx="15" cy="-20" r="6" fill="#e65100"/>
                <!-- Pink Daisy -->
                <circle cx="-5" cy="-5" r="14" fill="#f48fb1"/>
                <circle cx="-5" cy="-5" r="6" fill="#f57f17"/>
              </g>
            </g>
          </svg>
        </div>

        <!-- Main Image Element (Loaded if asset exists or chosen) -->
        <img id="chick-image" class="hidden-img" alt="Kawaii Chick with Flowers">

        <!-- Interactive Floating Glitter Stars Overlay -->
        <div class="stars-overlay" id="stars-overlay"></div>

        <!-- Optional Image Upload Control on Hover -->
        <div class="upload-badge" id="upload-badge" title="Click to choose custom image file">
          <span>📷 Select Image</span>
          <input type="file" id="image-file-input" accept="image/*">
        </div>
      </div>
    </div>

    <!-- Right Panel: Interactive Passcode Screen -->
    <div class="right-panel">
      <div class="passcode-card">
        
        <!-- Title Header -->
        <h1 class="passcode-title">Enter a passcode</h1>
        
        <!-- 4 Passcode Input Display Slots -->
        <div class="slots-container" id="slots-container">
          <div class="slot" data-index="0"></div>
          <div class="slot" data-index="1"></div>
          <div class="slot" data-index="2"></div>
          <div class="slot" data-index="3"></div>
        </div>

        <!-- Keypad Grid (4x3) -->
        <div class="keypad-grid" id="keypad-grid">
          <button class="key-btn" data-val="1"><span class="key-label underline-text">1</span></button>
          <button class="key-btn" data-val="2"><span class="key-label underline-text">2</span></button>
          <button class="key-btn" data-val="3"><span class="key-label underline-text">3</span></button>
          
          <button class="key-btn" data-val="4"><span class="key-label underline-text">4</span></button>
          <button class="key-btn" data-val="5"><span class="key-label underline-text">5</span></button>
          <button class="key-btn" data-val="6"><span class="key-label underline-text">6</span></button>
          
          <button class="key-btn" data-val="7"><span class="key-label underline-text">7</span></button>
          <button class="key-btn" data-val="8"><span class="key-label underline-text">8</span></button>
          <button class="key-btn" data-val="9"><span class="key-label underline-text">9</span></button>
          
          <button class="key-btn action-key" data-val="*"><span class="key-label underline-text">*</span></button>
          <button class="key-btn" data-val="0"><span class="key-label underline-text">0</span></button>
          <button class="key-btn action-key" data-val="#"><span class="key-label underline-text">#</span></button>
        </div>

        <!-- Quick Hint -->
        <div class="passcode-footer">
          <p class="hint-text">💡 Passcode: <strong>1234</strong></p>
        </div>

      </div>
    </div>

  </div>

  <!-- Unlocked Secret Modal -->
  <div class="modal-overlay hidden" id="secret-modal">
    <div class="secret-diary-card">
      <button class="close-modal-btn" id="close-modal-btn">&times;</button>
      <div class="diary-header">
        <span class="diary-badge">✨ UNLOCKED ✨</span>
        <h2>My Secret Kawaii Diary 💕</h2>
        <p class="diary-date" id="current-date-string"></p>
      </div>

      <div class="diary-content">
        <div class="chick-avatar">🐣</div>
        <textarea id="diary-text" placeholder="Write your secret notes, dreams, and thoughts here..."></textarea>
      </div>

      <div class="diary-actions">
        <button class="btn btn-save" id="save-diary-btn">💖 Save Note</button>
        <button class="btn btn-lock" id="lock-app-btn">🔒 Lock Diary</button>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
