<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter a Passcode 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', cursive;
      background: #d6f4dc;
    }
    .wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .left {
      width: 50%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #d6f4dc;
      background-image:
        linear-gradient(90deg, rgba(145,214,160,0.48) 50%, transparent 50%),
        linear-gradient(rgba(145,214,160,0.48) 50%, transparent 50%);
      background-size: 38px 38px;
    }
    .star {
      position: absolute;
      color: #ff5592;
      font-size: 1.6rem;
      filter: drop-shadow(0 1px 4px rgba(255,85,146,0.45));
      pointer-events: none;
      animation: floatStar 3s ease-in-out infinite alternate;
      z-index: 2;
    }
    .s1{top:9%;left:11%;font-size:2rem;animation-delay:0s}
    .s2{top:14%;right:8%;font-size:1.5rem;animation-delay:.5s}
    .s3{top:41%;right:6%;font-size:1.8rem;animation-delay:1s}
    .s4{bottom:11%;left:8%;font-size:1.7rem;animation-delay:1.5s}
    .s5{bottom:14%;right:12%;font-size:2rem;animation-delay:.8s}
    .s6{top:74%;left:19%;font-size:1.4rem;animation-delay:1.3s}
    .s7{top:6%;right:24%;font-size:1.7rem;animation-delay:.2s}
    .s8{top:46%;left:5%;font-size:1.5rem;animation-delay:2s}
    @keyframes floatStar {
      0%{transform:translateY(0) scale(1) rotate(0deg)}
      100%{transform:translateY(-9px) scale(1.2) rotate(16deg)}
    }
    .oval-wrap {
      position: relative;
      width: clamp(200px,26vh,310px);
      height: clamp(265px,35vh,415px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .hearts-ring {
      position: absolute;
      inset: -16px;
      pointer-events: none;
      z-index: 10;
    }
    .heart-dot {
      position: absolute;
      font-size: clamp(.8rem,1.1vh,1rem);
      line-height: 1;
      filter: drop-shadow(0 1px 3px rgba(220,40,80,.4));
    }
    .oval {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 16px 42px rgba(0,0,0,.13), inset 0 0 18px rgba(0,0,0,.02);
      border: 7px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 14px;
    }
    .chick-svg {
      width: 94%;
      height: 94%;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,.07));
    }
    .right {
      width: 50%;
      height: 100%;
      background: #e02b5a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5vh 4vw;
      gap: clamp(14px,2.5vh,30px);
    }
    .title {
      color: #fff;
      font-size: clamp(1.6rem,3vw,3rem);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,.12);
    }
    .pin-row {
      display: flex;
      gap: clamp(10px,1.4vw,18px);
    }
    .pin-box {
      width: clamp(44px,5.5vw,66px);
      height: clamp(44px,5.5vw,66px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,.16);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s cubic-bezier(.175,.885,.32,1.275), box-shadow .2s;
    }
    .pin-box.filled{transform:scale(1.08);box-shadow:0 6px 20px rgba(0,0,0,.22)}
    .pin-box.filled::after{
      content:'●';
      color:#e02b5a;
      font-size:clamp(1.2rem,2vw,1.7rem);
      animation:pop .2s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
    .keypad {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: clamp(10px,2vh,22px) clamp(12px,1.8vw,26px);
      width: 100%;
      max-width: clamp(210px,28vw,360px);
    }
    .key {
      width: clamp(54px,6vw,76px);
      height: clamp(54px,6vw,76px);
      border-radius: 50%;
      background: #fff;
      border: none;
      color: #e02b5a;
      font-family: 'Fredoka', cursive;
      font-size: clamp(1.4rem,2vw,2.1rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      box-shadow: 0 6px 16px rgba(0,0,0,.18), inset 0 -3px 0 rgba(0,0,0,.09);
      transition: transform .12s ease, box-shadow .12s ease;
      outline: none;
      user-select: none;
    }
    .key:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 10px 22px rgba(0,0,0,.24),inset 0 -3px 0 rgba(0,0,0,.09)}
    .key:active{transform:translateY(2px) scale(.96);box-shadow:0 2px 6px rgba(0,0,0,.15),inset 0 1px 2px rgba(0,0,0,.12)}
    .modal-bg{
      position:fixed;inset:0;
      background:rgba(0,0,0,.65);
      backdrop-filter:blur(6px);
      display:flex;align-items:center;justify-content:center;
      z-index:9999;padding:20px;
    }
    .modal-bg.hidden{display:none!important}
    .modal-card{
      background:#fff;border-radius:26px;padding:36px 28px;
      max-width:380px;width:100%;text-align:center;
      box-shadow:0 22px 44px rgba(0,0,0,.3);
      animation:mpop .3s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes mpop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .modal-icon{font-size:3.5rem;margin-bottom:10px}
    .modal-card h2{color:#e02b5a;font-size:1.9rem;margin-bottom:8px}
    .modal-card p{color:#4a5568;font-size:1.05rem;margin-bottom:22px;line-height:1.5}
    .modal-btn{
      background:#e02b5a;color:#fff;border:none;
      padding:13px 28px;border-radius:30px;
      font-family:'Fredoka',cursive;font-size:1.1rem;font-weight:700;
      cursor:pointer;box-shadow:0 6px 18px rgba(224,43,90,.35);
      transition:transform .15s,background .15s;
    }
    .modal-btn:hover{transform:scale(1.05);background:#c7224c}
    @media(max-width:700px){
      html,body{overflow-y:auto}
      .wrapper{flex-direction:column;height:auto;min-height:100vh}
      .left{width:100%;height:52vw;min-height:220px}
      .right{width:100%;height:auto;flex:1;padding:5vw 5vw 9vw}
      .oval-wrap{width:34vw;height:45vw;max-width:180px;max-height:240px}
    }
  </style>
</head>

    <h2>Passcode Accepted!</h2>

    <button class="modal-btn" id="modalClose">Reset & Try Again 💕</button>
  </div>

<script>
  function makeHearts(){
    const ring=document.getElementById('heartsRing');
    ring.innerHTML='';
    for(let i=0;i<30;i++){
      const ang=(i/30)*2*Math.PI-Math.PI/2;
      const x=50+48.5*Math.cos(ang),y=50+48.5*Math.sin(ang);
      const el=document.createElement('span');
      el.className='heart-dot';
      el.textContent='❤️';
      el.style.left=x+'%';el.style.top=y+'%';
      el.style.transform=`translate(-50%,-50%) rotate(${ang*180/Math.PI+90}deg)`;
      ring.appendChild(el);
    }
  }
  makeHearts();
  window.addEventListener('resize',makeHearts);
  (function(){
    let pin='';
    const boxes=document.querySelectorAll('.pin-box');
    const modal=document.getElementById('modal');
    const close=document.getElementById('modalClose');
    function refresh(){boxes.forEach((b,i)=>b.classList.toggle('filled',i<pin.length));if(pin.length===4)setTimeout(()=>modal.classList.remove('hidden'),260);}
    function push(v){if(pin.length<4){pin+=v;refresh();if(navigator.vibrate)navigator.vibrate(18);}}
    document.getElementById('keypad').addEventListener('click',e=>{const b=e.target.closest('.key');if(b)push(b.dataset.v);});
    close.addEventListener('click',()=>{pin='';refresh();modal.classList.add('hidden');});
    document.addEventListener('keydown',e=>{
      if(e.key>='0'&&e.key<='9')push(e.key);
      else if(e.key==='*'||e.key==='#')push(e.key);
      else if(e.key==='Backspace'){pin=pin.slice(0,-1);refresh();}
      else if(e.key==='Escape'){pin='';refresh();modal.classList.add('hidden');}
    });
  })();
</script>
