<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Girlfriend Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Short+Stack&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LANDING SCREEN -->
  <div class="screen" id="screen-lock">

    <!-- LEFT: Illustration -->
    <div class="left-panel">
      <img src="assets/left_illustration.jpg" alt="Girlfriend Day" id="hero-img">
    </div>

    <!-- RIGHT: Passcode -->
    <div class="right-panel">
      <div class="passcode-wrap">

        <h1 class="passcode-title">Enter a passcode</h1>

        <div class="slots" id="slots">
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>

        <div class="pad">
          <button class="key" data-v="1">1</button>
          <button class="key" data-v="2">2</button>
          <button class="key" data-v="3">3</button>
          <button class="key" data-v="4">4</button>
          <button class="key" data-v="5">5</button>
          <button class="key" data-v="6">6</button>
          <button class="key" data-v="7">7</button>
          <button class="key" data-v="8">8</button>
          <button class="key" data-v="9">9</button>
          <button class="key sym" data-v="*">*</button>
          <button class="key" data-v="0">0</button>
          <button class="key sym" data-v="#">#</button>
        </div>

      </div>
    </div>
  </div>

  <!-- UNLOCKED SCREEN -->
  <div class="screen hidden" id="screen-message">
    <div class="message-card">
      <div class="msg-top-label">Happy Girlfriend Day</div>
      <h2 class="msg-heading">A message just for you</h2>
      <p class="msg-date" id="msg-date"></p>
      <div class="msg-body">
        <p>Happy Girlfriend Day, my love!</p>
        <p>Every moment with you is a gift I never take for granted. Thank you for being the most wonderful person in my life. I love you more than words can say.</p>
        <p class="msg-sign">— Always yours</p>
      </div>
      <button class="btn-close" id="btn-close">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
