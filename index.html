<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter a Passcode | Kawaii Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MAIN LOCK SCREEN CONTAINER -->
  <div class="lock-screen-wrapper">
    <div class="lock-card">
      
      <!-- LEFT SIDE: Soft Green Gingham Background with Oval Chick Frame & Scattered Pink Stars -->
      <div class="left-side">
        <div class="pink-star star-1">★</div>
        <div class="pink-star star-2">✦</div>
        <div class="pink-star star-3">★</div>
        <div class="pink-star star-4">✦</div>
        <div class="pink-star star-5">★</div>
        <div class="pink-star star-6">✦</div>
        <div class="pink-star star-7">★</div>
        <div class="pink-star star-8">✦</div>

        <!-- Central Oval Container -->
        <div class="oval-container">
          <div class="hearts-ring" id="heartsRing"></div>
          <div class="white-oval-frame">
            <!-- Image loaded via JS from raw GitHub URL -->
            <img src="cute_chick_flowers.png" 
                 alt="Cute Kawaii Chick with Flower Bouquet" 
                 class="chick-image" 
                 id="chickImg"
                 onerror="this.onerror=null; this.style.display='none'; document.getElementById('chickSvgFallback').style.display='block';">
            
            <!-- SVG Fallback -->
            <svg id="chickSvgFallback" class="chick-svg-fallback" viewBox="0 0 300 300" style="display:none;" aria-label="Cute Chick Holding Flowers">
              <g transform="translate(0, 5)">
                <ellipse cx="120" cy="265" rx="16" ry="8" fill="#ff9e3b" />
                <ellipse cx="180" cy="265" rx="16" ry="8" fill="#ff9e3b" />
                <ellipse cx="150" cy="165" rx="95" ry="105" fill="#ffe770" stroke="#7a5522" stroke-width="4" />
                <path d="M142,62 Q150,42 158,62 Q166,45 170,66" fill="none" stroke="#7a5522" stroke-width="4" stroke-linecap="round" />
                <ellipse cx="108" cy="168" rx="15" ry="10" fill="#ffb3c6" opacity="0.85" />
                <ellipse cx="192" cy="168" rx="15" ry="10" fill="#ffb3c6" opacity="0.85" />
                <ellipse cx="125" cy="148" rx="7" ry="9" fill="#2d221e" />
                <ellipse cx="175" cy="148" rx="7" ry="9" fill="#2d221e" />
                <circle cx="127" cy="145" r="2.5" fill="#ffffff" />
                <circle cx="177" cy="145" r="2.5" fill="#ffffff" />
                <path d="M138,158 Q150,174 162,158 Z" fill="#ff9426" stroke="#7a5522" stroke-width="3" />
                <path d="M90,195 Q70,170 95,155 Q110,180 90,195 Z" fill="#78ca87" stroke="#3b7a48" stroke-width="3" />
                <path d="M210,195 Q230,170 205,155 Q190,180 210,195 Z" fill="#78ca87" stroke="#3b7a48" stroke-width="3" />
                <path d="M140,225 L160,225" stroke="#489e5a" stroke-width="6" stroke-linecap="round" />
                <ellipse cx="150" cy="225" rx="14" ry="9" fill="#a6e3b8" stroke="#3b7a48" stroke-width="3" />
                <g transform="translate(150, 195)">
                  <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#7a5522" stroke-width="3" />
                  <circle cx="-14" cy="0" r="8" fill="#ffffff" />
                  <circle cx="14" cy="0" r="8" fill="#ffffff" />
                  <circle cx="0" cy="-14" r="8" fill="#ffffff" />
                  <circle cx="0" cy="14" r="8" fill="#ffffff" />
                  <circle cx="0" cy="0" r="9" fill="#ffc83b" stroke="#7a5522" stroke-width="2" />
                </g>
                <g transform="translate(118, 185)">
                  <circle cx="0" cy="0" r="12" fill="#ffdd55" stroke="#7a5522" stroke-width="2.5" />
                  <circle cx="0" cy="0" r="6" fill="#e88b23" />
                </g>
                <g transform="translate(182, 185)">
                  <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="#7a5522" stroke-width="2.5" />
                  <circle cx="0" cy="0" r="6" fill="#ffc83b" />
                </g>
                <path d="M85,185 Q110,215 130,205" fill="none" stroke="#7a5522" stroke-width="4" stroke-linecap="round" />
                <path d="M215,185 Q190,215 170,205" fill="none" stroke="#7a5522" stroke-width="4" stroke-linecap="round" />
              </g>
            </svg>
          </div>
        </div>
      </div>

      <!-- RIGHT SIDE: Solid Bright Pink/Magenta Background with Keypad -->
      <div class="right-side">
        <h1 class="passcode-title">Enter a passcode</h1>

        <div class="passcode-boxes" id="passcodeBoxes">
          <div class="pin-box" data-index="0"></div>
          <div class="pin-box" data-index="1"></div>
          <div class="pin-box" data-index="2"></div>
          <div class="pin-box" data-index="3"></div>
        </div>

        <div class="keypad-grid" id="keypadGrid">
          <button class="key-btn" data-val="1">1</button>
          <button class="key-btn" data-val="2">2</button>
          <button class="key-btn" data-val="3">3</button>
          <button class="key-btn" data-val="4">4</button>
          <button class="key-btn" data-val="5">5</button>
          <button class="key-btn" data-val="6">6</button>
          <button class="key-btn" data-val="7">7</button>
          <button class="key-btn" data-val="8">8</button>
          <button class="key-btn" data-val="9">9</button>
          <button class="key-btn symbol-btn" data-val="*">*</button>
          <button class="key-btn" data-val="0">0</button>
          <button class="key-btn symbol-btn" data-val="#">#</button>
        </div>
      </div>

    </div>
  </div>

  <!-- SUCCESS MODAL -->
  <div class="modal-overlay hidden" id="successModal">
    <div class="modal-card">
      <div class="modal-icon">💖</div>
      <h2>Passcode Accepted!</h2>
      <p>Welcome! You've unlocked the cute passcode screen. 🥰✨</p>
      <button class="modal-btn" id="closeSuccessBtn">Reset & Try Again 💕</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Try to load the generated chick image from GitHub raw URL
    (function() {
      const img = document.getElementById('chickImg');
      const svgFallback = document.getElementById('chickSvgFallback');
      const paths = [
        'cute_chick_flowers.png',
        'https://raw.githubusercontent.com/Vignesh88-AI/The-First-August/main/cute_chick_flowers.png'
      ];
      function tryLoad(idx) {
        if (idx >= paths.length) {
          if (img) img.style.display = 'none';
          if (svgFallback) svgFallback.style.display = 'block';
          return;
        }
        const t = new Image();
        t.onload = function() {
          if (img) { img.src = paths[idx]; img.style.display = 'block'; }
          if (svgFallback) svgFallback.style.display = 'none';
        };
        t.onerror = function() { tryLoad(idx + 1); };
        t.src = paths[idx];
      }
      tryLoad(0);
    })();
  </script>
</body>
</html>
