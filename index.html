<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter a Passcode 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', cursive;
      background: #d6f4dc;
    }

    /* ======================== FULLSCREEN SPLIT ======================== */
    .wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* ======================== LEFT: GINGHAM SIDE ======================== */
    .left {
      width: 50%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #d6f4dc;
      background-image:
        linear-gradient(90deg, rgba(145, 214, 160, 0.48) 50%, transparent 50%),
        linear-gradient(rgba(145, 214, 160, 0.48) 50%, transparent 50%);
      background-size: 38px 38px;
    }

    /* Pink floating stars */
    .star {
      position: absolute;
      color: #ff5592;
      font-size: 1.6rem;
      filter: drop-shadow(0 1px 4px rgba(255,85,146,0.45));
      pointer-events: none;
      animation: floatStar 3s ease-in-out infinite alternate;
      z-index: 2;
    }
    .s1 { top:8%;  left:10%;  font-size:2.2rem; animation-delay:0s;   }
    .s2 { top:14%; right:8%;  font-size:1.5rem; animation-delay:.5s;  }
    .s3 { top:42%; right:5%;  font-size:1.9rem; animation-delay:1s;   }
    .s4 { bottom:10%; left:8%; font-size:1.7rem; animation-delay:1.5s; }
    .s5 { bottom:12%; right:11%; font-size:2.1rem; animation-delay:.8s;  }
    .s6 { top:76%; left:18%;  font-size:1.4rem; animation-delay:1.3s; }
    .s7 { top:6%;  right:22%; font-size:1.8rem; animation-delay:.2s;  }
    .s8 { top:48%; left:5%;   font-size:1.5rem; animation-delay:2s;   }

    @keyframes floatStar {
      0%   { transform: translateY(0) scale(1) rotate(0deg); }
      100% { transform: translateY(-10px) scale(1.22) rotate(16deg); }
    }

    /* ======================== OVAL FRAME & HEARTS RING ======================== */
    .oval-wrap {
      position: relative;
      width: clamp(260px, 32vh, 380px);
      height: clamp(340px, 45vh, 500px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: transform 0.3s ease;
    }
    .oval-wrap:hover {
      transform: scale(1.02);
    }

    .hearts-ring {
      position: absolute;
      inset: -18px;
      pointer-events: none;
      z-index: 10;
    }

    .heart-dot {
      position: absolute;
      font-size: clamp(0.9rem, 1.3vh, 1.25rem);
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(220, 30, 80, 0.45));
      animation: pulseHeart 2.5s ease-in-out infinite alternate;
    }

    @keyframes pulseHeart {
      0% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); }
      100% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.15); }
    }

    /* White Oval Frame */
    .oval {
      width: 100%;
      height: 100%;
      border-radius: 50% / 50%;
      background: #ffffff;
      box-shadow: 
        0 22px 55px rgba(0, 0, 0, 0.16),
        inset 0 0 20px rgba(0, 0, 0, 0.02),
        0 0 0 10px rgba(255, 255, 255, 0.85),
        0 0 30px rgba(224, 43, 90, 0.28);
      border: 8px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 16px;
      position: relative;
    }

    /* Generated Chick Image */
    .chick-img {
      width: 92%;
      height: 92%;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.1));
      border-radius: 50%;
    }

    /* ======================== RIGHT: PINK SIDE ======================== */
    .right {
      width: 50%;
      height: 100%;
      background: #e02b5a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5vh 4vw;
      gap: clamp(16px, 2.8vh, 32px);
    }

    .title {
      color: #ffffff;
      font-size: clamp(1.6rem, 3vw, 3rem);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,.12);
      letter-spacing: .3px;
    }

    /* 4 PIN boxes */
    .pin-row {
      display: flex;
      gap: clamp(10px, 1.4vw, 18px);
    }

    .pin-box {
      width: clamp(46px, 5.8vw, 68px);
      height: clamp(46px, 5.8vw, 68px);
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s cubic-bezier(.175,.885,.32,1.275), box-shadow .2s;
      position: relative;
    }
    .pin-box.filled {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0,0,0,.22);
    }
    .pin-box.filled::after {
      content: '●';
      color: #e02b5a;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      animation: pop .2s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes pop {
      0%   { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vh, 22px) clamp(12px, 1.8vw, 26px);
      width: 100%;
      max-width: clamp(210px, 28vw, 360px);
    }

    .key {
      width: clamp(56px, 6.2vw, 78px);
      height: clamp(56px, 6.2vw, 78px);
      border-radius: 50%;
      background: #ffffff;
      border: none;
      color: #e02b5a;
      font-family: 'Fredoka', cursive;
      font-size: clamp(1.4rem, 2.1vw, 2.2rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      box-shadow: 0 6px 16px rgba(0,0,0,.18), inset 0 -3px 0 rgba(0,0,0,.09);
      transition: transform .12s ease, box-shadow .12s ease;
      outline: none;
      user-select: none;
    }
    .key:hover  { transform: translateY(-2px) scale(1.05); box-shadow: 0 10px 22px rgba(0,0,0,.24), inset 0 -3px 0 rgba(0,0,0,.09); }
    .key:active { transform: translateY(2px) scale(.96);   box-shadow: 0 2px 6px rgba(0,0,0,.15), inset 0 1px 2px rgba(0,0,0,.12); }

    /* ======================== MODAL ======================== */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .modal-bg.hidden { display: none !important; }
    .modal-card {
      background: #ffffff;
      border-radius: 26px;
      padding: 36px 28px;
      max-width: 380px; width: 100%;
      text-align: center;
      box-shadow: 0 22px 44px rgba(0,0,0,.3);
      animation: mpop .3s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes mpop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
    .modal-icon  { font-size: 3.5rem; margin-bottom: 10px; }
    .modal-card h2 { color: #e02b5a; font-size: 1.9rem; margin-bottom: 8px; }
    .modal-card p  { color: #4a5568; font-size: 1.05rem; margin-bottom: 22px; line-height: 1.5; }
    .modal-btn {
      background: #e02b5a; color: #ffffff; border: none;
      padding: 13px 28px; border-radius: 30px;
      font-family: 'Fredoka', cursive; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; box-shadow: 0 6px 18px rgba(224,43,90,.35);
      transition: transform .15s, background .15s;
    }
    .modal-btn:hover { transform: scale(1.05); background: #c7224c; }

    /* ======================== MOBILE ======================== */
    @media (max-width: 700px) {
      html, body { overflow-y: auto; }
      .wrapper { flex-direction: column; height: auto; min-height: 100vh; }
      .left  { width: 100%; height: 60vw; min-height: 260px; }
      .right { width: 100%; height: auto; flex: 1; padding: 6vw 5vw 10vw; }
      .oval-wrap { width: 44vw; height: 58vw; max-width: 220px; max-height: 290px; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- ======= LEFT: GINGHAM + KAWAII OVAL FRAME ======= -->
  <div class="left">
    <!-- Pink floating stars -->
    <span class="star s1">★</span>
    <span class="star s2">✦</span>
    <span class="star s3">★</span>
    <span class="star s4">✦</span>
    <span class="star s5">★</span>
    <span class="star s6">✦</span>
    <span class="star s7">★</span>
    <span class="star s8">✦</span>

    <!-- Oval frame with hearts ring -->
    <div class="oval-wrap">
      <div class="hearts-ring" id="heartsRing"></div>
      <div class="oval">
        <!-- Generated Kawaii Chick Holding Flowers Image -->
        <img id="chickImg" 
             class="chick-img" 
             src="cute_chick_flowers.png" 
             alt="Cute Kawaii Chick Holding Flowers">
      </div>
    </div>
  </div>

  <!-- ======= RIGHT: PINK KEYPAD ======= -->
  <div class="right">
    <h1 class="title">Enter a passcode</h1>

    <!-- 4 PIN boxes -->
    <div class="pin-row" id="pinRow">
      <div class="pin-box" data-i="0"></div>
      <div class="pin-box" data-i="1"></div>
      <div class="pin-box" data-i="2"></div>
      <div class="pin-box" data-i="3"></div>
    </div>

    <!-- Phone-style 3×4 keypad -->
    <div class="keypad" id="keypad">
      <button class="key" data-v="1">1</button>
      <button class="key" data-v="2">2</button>
      <button class="key" data-v="3">3</button>
      <button class="key" data-v="4">4</button>
      <button class="key" data-v="5">5</button>
      <button class="key" data-v="6">6</button>
      <button class="key" data-v="7">7</button>
      <button class="key" data-v="8">8</button>
      <button class="key" data-v="9">9</button>
      <button class="key" data-v="*">*</button>
      <button class="key" data-v="0">0</button>
      <button class="key" data-v="#">#</button>
    </div>
  </div>

</div>

<!-- ======= SUCCESS MODAL ======= -->
<div class="modal-bg hidden" id="modal">
  <div class="modal-card">
    <div class="modal-icon">💖</div>
    <h2>Passcode Accepted!</h2>
    <p>Welcome! You've unlocked the cute portal. 🥰✨</p>
    <button class="modal-btn" id="modalClose">Reset & Try Again 💕</button>
  </div>
</div>

<script>
  /* ====== HEARTS RING (32 Pink Hearts along Oval) ====== */
  function makeHearts(){
    const ring = document.getElementById('heartsRing');
    if (!ring) return;
    ring.innerHTML = '';
    const n = 32;
    for(let i = 0; i < n; i++){
      const ang = (i / n) * 2 * Math.PI - Math.PI / 2;
      const x = 50 + 49 * Math.cos(ang);
      const y = 50 + 49 * Math.sin(ang);
      const el = document.createElement('span');
      el.className = 'heart-dot';
      el.textContent = '❤️';
      el.style.left = x + '%';
      el.style.top  = y + '%';
      const rot = (ang * 180 / Math.PI + 90);
      el.style.setProperty('--rot', rot + 'deg');
      el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
      el.style.animationDelay = (i * 0.08) + 's';
      ring.appendChild(el);
    }
  }
  makeHearts();
  window.addEventListener('resize', makeHearts);

  /* ====== IMAGE FALLBACK HANDLER ====== */
  (function() {
    const chickImg = document.getElementById('chickImg');
    const imagePaths = [
      'cute_chick_flowers.png',
      'file:///C:/Users/vigne/.gemini/antigravity-ide/brain/d491b869-79cf-47cf-bb57-2714c4dd530b/kawaii_chick_bouquet_final_1785523474472.png',
      'file:///C:/Users/vigne/.gemini/antigravity-ide/brain/d491b869-79cf-47cf-bb57-2714c4dd530b/cute_chick_flowers_1785522387514.png'
    ];
    let idx = 0;
    chickImg.onerror = function() {
      idx++;
      if (idx < imagePaths.length) {
        chickImg.src = imagePaths[idx];
      }
    };
  })();

  /* ====== PIN LOGIC ====== */
  (function(){
    let pin = '';
    const boxes  = document.querySelectorAll('.pin-box');
    const modal  = document.getElementById('modal');
    const close  = document.getElementById('modalClose');

    function refresh(){
      boxes.forEach((b,i) => b.classList.toggle('filled', i < pin.length));
      if(pin.length === 4) setTimeout(() => modal.classList.remove('hidden'), 260);
    }

    function push(v){
      if(pin.length < 4){
        pin += v;
        refresh();
        if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
      }
    }

    document.getElementById('keypad').addEventListener('click', e => {
      const b = e.target.closest('.key');
      if(b) push(b.dataset.v);
    });

    close.addEventListener('click', () => {
      pin = '';
      refresh();
      modal.classList.add('hidden');
    });

    document.addEventListener('keydown', e => {
      if(e.key >= '0' && e.key <= '9') push(e.key);
      else if(e.key === '*' || e.key === '#') push(e.key);
      else if(e.key === 'Backspace'){ pin = pin.slice(0, -1); refresh(); }
      else if(e.key === 'Escape'){ pin = ''; refresh(); modal.classList.add('hidden'); }
    });
  })();
</script>
</body>
</html>
